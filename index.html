      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #f3ece0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        overflow: hidden;
      }
      .stage {
        display: grid;
        place-items: center;
        width: 100%;
        max-width: 560px;
      }
      .stage > * {
        grid-area: 1/1;
      }

      .logo {
        width: 100%;
        max-width: 520px;
        height: auto;
        display: block;
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.18));
        animation:
          bob 5s ease-in-out infinite,
          logoFade 15s ease-in-out infinite;
      }
      .soon {
        font-family: "MetalMania", Impact, sans-serif;
        color: #121212;
        font-size: clamp(2.6rem, 12vw, 5.4rem);
        line-height: 1;
        text-align: center;
        letter-spacing: 0.01em;
        white-space: nowrap;
        text-shadow: 0 10px 22px rgba(0, 0, 0, 0.15);
        animation:
          soonFade 15s ease-in-out infinite,
          pulse 5s ease-in-out infinite;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes logoFade {
        0% {
          opacity: 0;
        }
        26.67% {
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        96.67% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes soonFade {
        0% {
          opacity: 1;
        }
        26.67% {
          opacity: 1;
        }
        30% {
          opacity: 0;
        }
        96.67% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
